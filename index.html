<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krankmeldung – Küche</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#20252b}
header{background:#fff;border-bottom:1px solid #ddd;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:700}.chef{background:#20252b;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700}
main{max-width:760px;margin:30px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 3px 14px #00000012;margin-bottom:20px}
h1{margin-top:0;font-size:26px}h2{font-size:20px}
label{display:block;font-weight:700;margin:14px 0 6px}
input{width:100%;padding:12px;border:1px solid #ccd2d8;border-radius:8px;font-size:16px}
button{cursor:pointer}
.send{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:#20252b;color:#fff;font-size:16px;font-weight:700}
.success{display:none;background:#eaf7ed;border:1px solid #b9dfc1;padding:14px;border-radius:8px;margin-top:15px}
.error{display:none;color:#b00020;margin-top:10px}
#adminPanel{display:none}
.item{border:1px solid #ddd;border-radius:9px;padding:13px;margin:10px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}
.delete{background:#b42318;color:#fff;border:0;border-radius:7px;padding:8px 10px}
.muted{color:#667085}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:16px}
.modalbox{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:400px}
.modalbuttons{display:flex;gap:10px;margin-top:18px}
.modalbuttons button{flex:1;padding:11px;border-radius:8px;border:0}
.cancel{background:#eee}
.login{background:#20252b;color:#fff}
@media(max-width:500px){main{margin:18px auto}.card{padding:18px}.item{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="logo">Küche · Krankmeldung</div>
  <button class="chef" id="adminBtn">Chef</button>
</header>

<main>
  <div class="card">
    <h1>Krankmeldung</h1>
    <p class="muted">Bitte die Krankmeldung vollständig ausfüllen.</p>

    <label for="employee">Mitarbeiter</label>
    <input id="employee" list="employees" placeholder="Name eingeben">
    <datalist id="employees">
      <option value="Tymechko Nazar">
      <option value="Fisunov Ostap">
      <option value="Yaroslav Marinovskiy">
      <option value="Eike Birkhofen">
    </datalist>

    <label for="shift">Schicht</label>
    <input id="shift" placeholder="z. B. Schicht 5">

    <label for="from">Von</label>
    <input id="from" type="date">

    <label for="to">Bis</label>
    <input id="to" type="date">

    <button class="send" id="send">Krankmeldung senden</button>
    <div class="error" id="formError"></div>
    <div class="success" id="success"></div>
  </div>

  <div class="card" id="adminPanel">
    <h2>Aktuelle Krankmeldungen</h2>
    <p class="muted">Nur für den Chef sichtbar.</p>
    <div id="list">Lade Daten…</div>
    <button class="send" id="logout">Abmelden</button>
  </div>
</main>

<div class="modal" id="modal">
  <div class="modalbox">
    <h2>Chef Login</h2>
    <label for="username">Benutzername</label>
    <input id="username" autocomplete="username" placeholder="chef">
    <label for="password">Passwort</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Passwort">
    <div class="error" id="loginError"></div>
    <div class="modalbuttons">
      <button class="cancel" id="cancel">Abbrechen</button>
      <button class="login" id="login">Einloggen</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://nuicmxcgkqeflmeqjpve.supabase.co";
const SUPABASE_KEY="sb_publishable_QSNawLIsldcQxAqIWvMHVg_V7hH7tfU";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ADMIN_EMAIL="chef@carecon.com";

const $=id=>document.getElementById(id);

function daysBetween(a,b){
  const x=new Date(a+"T00:00:00"), y=new Date(b+"T00:00:00");
  return Math.floor((y-x)/86400000)+1;
}

$("send").onclick=async()=>{
  $("formError").style.display="none";
  $("success").style.display="none";
  const employee=$("employee").value.trim();
  const shift=$("shift").value.trim();
  const date_from=$("from").value;
  const date_to=$("to").value;

  if(!employee||!shift||!date_from||!date_to){
    $("formError").textContent="Bitte alle Felder ausfüllen.";
    $("formError").style.display="block"; return;
  }
  if(date_to<date_from){
    $("formError").textContent="Das Datum „Bis“ darf nicht vor „Von“ liegen.";
    $("formError").style.display="block"; return;
  }

  const days=daysBetween(date_from,date_to);
  const {error}=await db.from("krankmeldungen").insert({
    employee,shift,date_from,date_to,days
  });

  if(error){
    $("formError").textContent="Fehler beim Senden: "+error.message;
    $("formError").style.display="block"; return;
  }

  // E-Mail über die Supabase Edge Function senden
  const mail = await db.functions.invoke("send-krankmeldung", {
    body: { employee, shift, date_from, date_to, days }
  });

  if(mail.error){
    $("formError").textContent="Krankmeldung gespeichert, aber E-Mail konnte nicht gesendet werden.";
    $("formError").style.display="block";
    return;
  }

  $("success").innerHTML="<b>Krankmeldung wurde erfolgreich gesendet.</b><br>"+employee+" · "+days+" Tag"+(days===1?"":"e");
  $("success").style.display="block";
  $("shift").value=""; $("from").value=""; $("to").value="";
};

$("adminBtn").onclick=()=>{
  $("modal").style.display="flex";
  $("loginError").style.display="none";
  $("username").value=""; $("password").value="";
};

$("cancel").onclick=()=>{$("modal").style.display="none"};

$("login").onclick=async()=>{
  $("loginError").style.display="none";
  const username=$("username").value.trim();
  const password=$("password").value;

  if(username!=="chef"){
    $("loginError").textContent="Falscher Benutzername oder Passwort.";
    $("loginError").style.display="block"; return;
  }

  const {error}=await db.auth.signInWithPassword({
    email:ADMIN_EMAIL,
    password
  });

  if(error){
    $("loginError").textContent="Falscher Benutzername oder Passwort.";
    $("loginError").style.display="block"; return;
  }

  $("modal").style.display="none";
  $("adminPanel").style.display="block";
  loadList();
};

$("logout").onclick=async()=>{
  await db.auth.signOut();
  $("adminPanel").style.display="none";
};

async function loadList(){
  $("list").textContent="Lade Daten…";
  const {data,error}=await db.from("krankmeldungen")
    .select("*").order("date_from",{ascending:false});

  if(error){
    $("list").textContent="Fehler beim Laden: "+error.message;
    return;
  }
  if(!data.length){
    $("list").innerHTML='<p class="muted">Keine Krankmeldungen vorhanden.</p>';
    return;
  }

  $("list").innerHTML=data.map(x=>`
    <div class="item">
      <div>
        <b>${escapeHtml(x.employee)}</b><br>
        Schicht: ${escapeHtml(x.shift)}<br>
        ${formatDate(x.date_from)} – ${formatDate(x.date_to)}
        · <b>${x.days} Tag${x.days===1?"":"e"}</b>
      </div>
      <button class="delete" onclick="deleteEntry(${x.id})">Löschen</button>
    </div>
  `).join("");
}

async function deleteEntry(id){
  if(!confirm("Diese Krankmeldung wirklich löschen?")) return;
  const {error}=await db.from("krankmeldungen").delete().eq("id",id);
  if(error){alert("Fehler: "+error.message);return;}
  loadList();
}

function formatDate(s){
  const p=s.split("-");
  return p[2]+"."+p[1]+"."+p[0];
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session && session.user.email===ADMIN_EMAIL){
    $("adminPanel").style.display="block";
    loadList();
  }
})();
</script>
</body>
</html>
