<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krankmeldung – Küche</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f7;color:#18212b}.wrap{min-height:100vh;display:flex;justify-content:center;padding:24px}.card{width:100%;max-width:540px;background:#fff;border-radius:24px;padding:28px;box-shadow:0 15px 45px rgba(20,30,40,.1)}.logo{width:58px;height:58px;border-radius:17px;background:#18212b;color:#fff;display:grid;place-items:center;font-size:26px;margin-bottom:18px}h1{margin:0 0 7px;font-size:28px}.sub{margin:0 0 28px;color:#6b7480}label{display:block;font-weight:650;margin:18px 0 8px}input{width:100%;padding:14px 15px;border:1px solid #d9dee4;border-radius:12px;background:#fff;font-size:16px;outline:none}input:focus{border-color:#596675;box-shadow:0 0 0 3px rgba(89,102,117,.1)}.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:26px;background:#18212b;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.msg,.error,.result{display:none;margin-top:16px;padding:13px 14px;border-radius:12px}.msg{background:#eaf7ef;color:#196b3a;font-weight:600}.error{background:#fff0f0;color:#a32929;font-weight:600}.result{border:1px solid #e4e8ec;background:#fafbfc;font-size:14px;line-height:1.65}.overview{margin-top:28px;padding-top:24px;border-top:1px solid #edf0f2}.overview-head{display:flex;align-items:center;justify-content:space-between}.overview h2{margin:0;font-size:19px}.overview p{margin:5px 0 0;color:#7b848e;font-size:13px}#countBadge{min-width:30px;height:30px;padding:0 9px;border-radius:15px;background:#eef1f4;display:grid;place-items:center;font-weight:700}.leave-list{margin-top:14px;display:grid;gap:9px}.leave-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;background:#f7f8f9;border-radius:12px}.leave-name{font-weight:700;font-size:14px}.leave-dates{color:#747d87;font-size:12px;margin-top:3px}.leave-days{font-weight:750;white-space:nowrap}.delete{width:auto;margin:0;padding:8px 10px;font-size:12px;background:#fff;color:#7b2222;border:1px solid #d9dee4}.empty{padding:14px;text-align:center;color:#929aa4;font-size:13px;background:#f7f8f9;border-radius:12px}.admin{text-align:right;margin-top:12px}.admin button{width:auto;margin:0;padding:9px 12px;font-size:12px;background:#eef1f4;color:#303a44}.footer{text-align:center;color:#929aa4;font-size:12px;margin-top:20px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px}.modal-card{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:380px}.modal-card h3{margin:0 0 8px}.modal-card p{color:#727b85;font-size:13px}.actions{display:flex;gap:10px}.actions button{margin-top:15px}.secondary{background:#eef1f4;color:#18212b}@media(max-width:430px){.card{padding:22px}.dates{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="logo">🏥</div><h1>Krankmeldung</h1><p class="sub">Küche · Mitarbeiter-Meldung</p>
<form id="form">
<label>Mitarbeiter</label><input id="employee" list="employees" placeholder="Name eingeben" required>
<datalist id="employees"><option value="Tymechko Nazar"><option value="Fisunov Ostap"><option value="Yaroslav Marinovskiy"><option value="Eike Birkhofen"></datalist>
<label>Schicht</label><input id="shift" placeholder="z. B. Schicht 5" required>
<label>Zeitraum</label><div class="dates"><input id="from" type="date" required><input id="to" type="date" required></div>
<button id="send" type="submit">Krankmeldung senden</button>
<div class="msg" id="msg">✓ Krankmeldung erfolgreich gespeichert</div><div class="error" id="err"></div><div class="result" id="result"></div>
</form>
<section class="overview"><div class="overview-head"><div><h2>Aktuelle Krankmeldungen</h2><p>Wer ist krank und wie viele Tage?</p></div><span id="countBadge">0</span></div><div id="list" class="leave-list"><div class="empty">Lade…</div></div><div class="admin"><button type="button" id="admin">Admin</button></div></section>
<div class="footer">Interner Küchenbereich</div>
</main></div>
<div class="modal" id="modal"><div class="modal-card"><h3>Admin-Bereich</h3><p>Anmelden, um Krankmeldungen zu löschen.</p><input id="email" type="email" placeholder="Admin-E-Mail"><input id="pass" type="password" placeholder="Passwort"><div class="actions"><button class="secondary" type="button" id="close">Abbrechen</button><button type="button" id="login">Anmelden</button></div><div class="error" id="loginErr"></div></div></div>
<script>
const URL="https://nuicmxcgkqeflmeqjpve.supabase.co",KEY="sb_publishable_QSNawLIsldcQxAqIWvMHVg_V7hH7tfU",db=supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id), from=$("from"),to=$("to");
function days(a,b){return Math.round((new Date(b)-new Date(a))/86400000)+1}function fmt(x){return new Date(x+"T00:00:00").toLocaleDateString("de-DE")}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
from.onchange=()=>{to.min=from.value;if(to.value&&to.value<from.value)to.value=from.value};
async function load(){let {data,error}=await db.from("krankmeldungen").select("*").order("created_at",{ascending:false});if(error){$("list").innerHTML='<div class="empty">Fehler beim Laden.</div>';return}let {data:{user}}=await db.auth.getUser();$("countBadge").textContent=data.length;if(!data.length){$("list").innerHTML='<div class="empty">Noch keine Krankmeldungen eingetragen.</div>';return}$("list").innerHTML=data.map(x=>`<div class="leave-item"><div><div class="leave-name">${esc(x.employee)}</div><div class="leave-dates">${fmt(x.date_from)} – ${fmt(x.date_to)} · ${esc(x.shift)}</div></div><div style="display:flex;align-items:center;gap:8px"><div class="leave-days">${x.days} ${x.days==1?"Tag":"Tage"}</div>${user?`<button class="delete" data-id="${x.id}" type="button">Löschen</button>`:""}</div></div>`).join("");document.querySelectorAll(".delete").forEach(b=>b.onclick=async()=>{if(!confirm("Diese Krankmeldung löschen?"))return;let r=await db.from("krankmeldungen").delete().eq("id",b.dataset.id);if(r.error)alert("Löschen nicht möglich.");else load()})}
$("form").onsubmit=async e=>{e.preventDefault();$("msg").style.display="none";$("err").style.display="none";$("result").style.display="none";if(to.value<from.value){$("err").textContent="Das Enddatum darf nicht vor dem Startdatum liegen.";$("err").style.display="block";return}let x={employee:$("employee").value.trim(),shift:$("shift").value.trim(),date_from:from.value,date_to:to.value,days:days(from.value,to.value)};$("send").disabled=true;$("send").textContent="Wird gespeichert…";let r=await db.from("krankmeldungen").insert(x);$("send").disabled=false;$("send").textContent="Krankmeldung senden";if(r.error){$("err").textContent=r.error.message;$("err").style.display="block";return}$("msg").style.display="block";$("result").style.display="block";$("result").innerHTML=`<b>Mitarbeiter:</b> ${esc(x.employee)}<br><b>Schicht:</b> ${esc(x.shift)}<br><b>Von:</b> ${fmt(x.date_from)}<br><b>Bis:</b> ${fmt(x.date_to)}<br><b>Dauer:</b> ${x.days} ${x.days==1?"Tag":"Tage"}<br><b>E-Mail:</b> fisunow3@gmail.com`;e.target.reset();to.min="";load()};
$("admin").onclick=()=>{$("modal").style.display="flex";$("loginErr").style.display="none"};$("close").onclick=()=>$("modal").style.display="none";$("login").onclick=async()=>{let r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error){$("loginErr").textContent="Anmeldung fehlgeschlagen.";$("loginErr").style.display="block"}else{$("modal").style.display="none";load()}};db.auth.onAuthStateChange(()=>load());load();
</script>
</body></html>
