<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krankmeldung – Küche</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f7;color:#18212b}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:520px;background:white;border-radius:24px;padding:30px;box-shadow:0 15px 45px rgba(20,30,40,.10)}
.logo{width:58px;height:58px;border-radius:17px;background:#18212b;color:white;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:18px}
h1{margin:0 0 7px;font-size:28px} .sub{margin:0 0 28px;color:#6b7480}
label{display:block;font-weight:650;margin:18px 0 8px}
select,input{width:100%;padding:14px 15px;border:1px solid #d9dee4;border-radius:12px;background:#fff;font-size:16px;outline:none}
select:focus,input:focus{border-color:#596675;box-shadow:0 0 0 3px rgba(89,102,117,.10)}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:26px;background:#18212b;color:white;font-size:16px;font-weight:700;cursor:pointer}
button:hover{opacity:.92}.msg{display:none;margin-top:18px;padding:13px 14px;border-radius:12px;background:#eaf7ef;color:#196b3a;font-weight:600}
.footer{text-align:center;color:#929aa4;font-size:12px;margin-top:20px}


.result{display:none;margin-top:10px;padding:14px;border:1px solid #e4e8ec;border-radius:12px;background:#fafbfc;font-size:14px;line-height:1.65}
.result strong{font-weight:700}
.overview{margin-top:28px;padding-top:24px;border-top:1px solid #edf0f2}
.overview-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.overview h2{margin:0;font-size:19px}
.overview p{margin:5px 0 0;color:#7b848e;font-size:13px}
#countBadge{min-width:30px;height:30px;padding:0 9px;border-radius:15px;background:#eef1f4;display:flex;align-items:center;justify-content:center;font-weight:700}
.leave-list{margin-top:14px;display:grid;gap:9px}
.leave-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;background:#f7f8f9;border-radius:12px}
.leave-name{font-weight:700;font-size:14px}
.leave-dates{color:#747d87;font-size:12px;margin-top:3px}
.leave-days{font-weight:750;white-space:nowrap}
.empty{padding:14px;text-align:center;color:#929aa4;font-size:13px;background:#f7f8f9;border-radius:12px}
@media(max-width:430px){.card{padding:23px}.dates{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <div class="logo">🏥</div>
    <h1>Krankmeldung</h1>
    <p class="sub">Küche · Mitarbeiter-Meldung</p>

    <form id="form">
      <label for="employee">Mitarbeiter</label>
      <select id="employee" name="Mitarbeiter" required>
        <option value="">Bitte auswählen</option>
        <option>Tymechko Nazar</option>
        <option>Fisunov Ostap</option>
        <option>Yaroslav Marinovskiy</option>
        <option>Eike Birkhofen</option>
      </select>

      <label for="shift">Schicht</label>
      <input id="shift" name="Schicht" type="text" placeholder="z. B. Schicht 5" required>

      <label>Zeitraum</label>
      <div class="dates">
        <div><input id="from" name="Von" type="date" required></div>
        <div><input id="to" name="Bis" type="date" required></div>
      </div>

      <button type="submit">Krankmeldung senden</button>
      <div class="msg" id="msg">✓ Krankmeldung erfolgreich gesendet</div>
      <div class="result" id="result"></div>
    </form>

    <section class="overview">
      <div class="overview-head">
        <div>
          <h2>Aktuelle Krankmeldungen</h2>
          <p>Wer ist krank und wie viele Tage?</p>
        </div>
        <span id="countBadge">0</span>
      </div>
      <div id="leaveList" class="leave-list">
        <div class="empty">Noch keine Krankmeldungen eingetragen.</div>
      </div>
    </section>

    <div class="footer">Interner Küchenbereich</div>
  </main>
</div>

<script>
const form=document.getElementById('form');
const msg=document.getElementById('msg');
const from=document.getElementById('from');
const to=document.getElementById('to');
const leaveList=document.getElementById('leaveList');
const countBadge=document.getElementById('countBadge');

from.addEventListener('change',()=>{
  to.min=from.value;
  if(to.value && to.value<from.value) to.value=from.value;
});

function formatDate(value){
  if(!value) return '';
  return new Date(value + 'T00:00:00').toLocaleDateString('de-DE');
}

function daysBetween(a,b){
  const start=new Date(a+'T00:00:00');
  const end=new Date(b+'T00:00:00');
  return Math.round((end-start)/86400000)+1;
}

function renderLeaves(){
  const leaves=JSON.parse(localStorage.getItem('krankmeldungen') || '[]');
  countBadge.textContent=leaves.length;
  if(!leaves.length){
    leaveList.innerHTML='<div class="empty">Noch keine Krankmeldungen eingetragen.</div>';
    return;
  }
  leaveList.innerHTML=leaves.map(x=>`
    <div class="leave-item">
      <div>
        <div class="leave-name">${x.employee}</div>
        <div class="leave-dates">${formatDate(x.from)} – ${formatDate(x.to)} · ${x.shift}</div>
      </div>
      <div class="leave-days">${x.days} ${x.days===1?'Tag':'Tage'}</div>
    </div>
  `).join('');
}

form.addEventListener('submit',e=>{
  e.preventDefault();

  if(to.value<from.value){
    alert('Das Enddatum darf nicht vor dem Startdatum liegen.');
    return;
  }

  const entry={
    employee:document.getElementById('employee').value,
    shift:document.getElementById('shift').value,
    from:from.value,
    to:to.value,
    days:daysBetween(from.value,to.value)
  };

  const leaves=JSON.parse(localStorage.getItem('krankmeldungen') || '[]');
  leaves.unshift(entry);
  localStorage.setItem('krankmeldungen',JSON.stringify(leaves));
  renderLeaves();

  msg.style.display='block';
  document.getElementById('result').style.display='block';
  document.getElementById('result').innerHTML=
    '<strong>Mitarbeiter:</strong> '+entry.employee+'<br>'+
    '<strong>Schicht:</strong> '+entry.shift+'<br>'+
    '<strong>Von:</strong> '+formatDate(entry.from)+'<br>'+
    '<strong>Bis:</strong> '+formatDate(entry.to)+'<br>'+
    '<strong>Dauer:</strong> '+entry.days+' '+(entry.days===1?'Tag':'Tage')+'<br>'+
    '<strong>E-Mail:</strong> fisunow3@gmail.com';
});

renderLeaves();
</script>
</body>
</html>
